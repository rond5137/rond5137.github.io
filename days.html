<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дни</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent: #3498db;
            --accent-past: #e74c3c;
            --accent-future: #2ecc71;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .current-time {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        input, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .event-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--accent);
            position: relative;
        }

        .event-card.future { border-left-color: var(--accent-future); }
        .event-card.past { border-left-color: var(--accent-past); }

        .event-info .event-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .event-info .event-date {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .event-countdown {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .countdown-main {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .countdown-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            color: var(--text-muted);
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 15px;
        }

        .delete-btn:hover {
            color: var(--accent-past);
        }
    </style>
</head>
<body>

<!--    <h1>Разница дат от текущего момента</h1>-->
<!--    <div class="current-time" id="currentTime">Текущая дата: &#45;&#45;.&#45;&#45;.&#45;&#45;&#45;&#45; &#45;&#45;:&#45;&#45;:&#45;&#45;</div>-->

    <!-- Список дат -->
    <div class="events-list" id="eventsList"></div>

    <!-- Форма добавления нового события -->
    <button style="margin-top: 25px; width: 100%" onclick="openAddForm()" id="addBtn">Добавить</button>
    <div class="controls" id="eventAddForm" style="display: none">
        <div class="form-group">
            <label for="eventName">Название события</label>
            <input type="text" id="eventName" placeholder="Например: Новый Год" required>
        </div>
        <div class="form-group">
            <label for="eventDate">Дата и время</label>
            <input type="datetime-local" id="eventDate" required>
        </div>
        <button style="margin-top: 25px; width: 100%" onclick="addEvent()">Добавить</button>
    </div>

    <script>
        // Стартовый список дат (можно заменить на свои)
        let events = [
            { id: 0, name: "Пекин", date: "2026-12-04T16:45" },
            { id: 1, name: "День рождения", date: "2026-12-08T16:00" },
            { id: 2, name: "Новый год 2027", date: "2027-01-01T00:00" },
            { id: 3, name: "Всего", date: "1979-12-08T16:00" },
        ];

        // Загрузка данных из локального хранилища браузера, если они есть
        if (localStorage.getItem('savedEvents')) {
            events = JSON.parse(localStorage.getItem('savedEvents'));
        }

        function openAddForm() {
            const eventAddForm = document.getElementById('eventAddForm');
            const addBtn = document.getElementById('addBtn');
            eventAddForm.style.display = 'block';
            addBtn.style.display = 'none';
        }

        function saveEvents() {
            localStorage.setItem('savedEvents', JSON.stringify(events));
        }

        function addEvent() {
            const nameInput = document.getElementById('eventName');
            const dateInput = document.getElementById('eventDate');

            if (!nameInput.value || !dateInput.value) return;

            const newEvent = {
                id: Date.now(),
                name: nameInput.value,
                date: dateInput.value
            };

            events.push(newEvent);
            saveEvents();
            renderEvents();

            nameInput.value = '';
            dateInput.value = '';
        }

        function deleteEvent(id) {
            const userResponse = confirm("Удалить?");
            if (userResponse) {
                events = events.filter(e => e.id !== id);
                saveEvents();
                renderEvents();
            }
        }

        function updateTickers() {
            const now = new Date();

            // Вывод текущего времени на экран
            // document.getElementById('currentTime').innerText = `Текущее время: ${now.toLocaleString('ru-RU')}`;

            events.forEach(event => {
                const targetDate = new Date(event.date);
                const card = document.getElementById(`card-${event.id}`);
                if (!card) return;

                const diffMs = targetDate - now;
                const isPast = diffMs < 0;
                const absDiff = Math.abs(diffMs);

                // Расчет компонентов времени
                // const seconds = Math.floor((absDiff / 1000) % 60);
                const minutes = Math.floor((absDiff / 1000 / 60) % 60);
                const hours = Math.floor((absDiff / (1000 * 60 * 60)) % 24);
                const days = Math.floor(absDiff / (1000 * 60 * 60 * 24));

                // Смена стилей в зависимости от того, в прошлом дата или в будущем
                card.className = `event-card ${isPast ? 'past' : 'future'}`;

                // Текст статуса
                // const prefix = isPast ? "Прошло: " : "Осталось: ";

                // const mainText = `${days}д. ${hours}ч. ${minutes}м. ${seconds}с.`;
                const mainText = `${days}д. ${hours}ч. ${minutes}м.`;
                // const subText = `${prefix} (${targetDate.toLocaleDateString('ru-RU')} в ${targetDate.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})})`;
                const subText = `${targetDate.toLocaleDateString('ru-RU')} ${targetDate.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})}`;

                card.querySelector('.countdown-main').innerText = mainText;
                card.querySelector('.countdown-sub').innerText = subText;
            });
        }

        function renderEvents() {
            const container = document.getElementById('eventsList');
            container.innerHTML = '';

            events.forEach(event => {
                const card = document.createElement('div');
                card.id = `card-${event.id}`;
                card.className = 'event-card';

                card.innerHTML = `
                    <div class="event-info">
                        <div class="event-title">${event.name}</div>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <div class="event-countdown">
                            <div class="countdown-main">--</div>
                            <div class="countdown-sub">--</div>
                        </div>
                        <button class="delete-btn" onclick="deleteEvent(${event.id})">&times;</button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateTickers();
        }

        // Инициализация интерфейса
        renderEvents();
        // Обновление каждую секунду
        setInterval(updateTickers, 1000 * 60);
    </script>
</body>
</html>
